name: Sync AI rules

on:
  schedule:
    # 17:00 UTC = 01:00 Asia/Shanghai on the following day.
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-ai-rules.yml'
      - 'scripts/sync_ai_rules.py'
      - 'rules/ai_sources.json'
      - 'rules/ai_custom.yaml'
      - 'requirements-ai-sync.txt'
      - 'tests/test_sync_ai_rules.py'

# Grant only the permission needed by the single publishing job.
permissions: {}

concurrency:
  group: sync-ai-rules-main
  cancel-in-progress: false

jobs:
  sync:
    name: Validate, generate, and update AI rules
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ai-sync.txt

      - name: Install dependencies
        run: python -m pip --disable-pip-version-check install --retries 3 --timeout 30 -r requirements-ai-sync.txt

      - name: Run validation tests
        run: |
          test -f tests/test_sync_ai_rules.py
          python -m unittest discover -s tests -p 'test_sync_ai_rules.py' -v

      - name: Generate AI rules
        run: python scripts/sync_ai_rules.py

      - name: Commit and push changed AI rules outputs
        timeout-minutes: 3
        run: |
          set -euo pipefail
          output_files=(AI_No_Resolve.yaml Surge/AI.list)

          git add -- "${output_files[@]}"
          if git diff --cached --quiet -- "${output_files[@]}"; then
            printf '%s\n' 'AI rules are unchanged; no commit was created.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check -- "${output_files[@]}"

          # Never publish a result generated from a superseded main branch.
          git fetch --no-tags origin refs/heads/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            printf '%s\n' '::error::main changed while rules were generated. Re-run this workflow against the latest main branch.'
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --only -m 'chore: update AI rules' -- "${output_files[@]}"

          # A concurrent push or branch protection must fail normally.
          # Do not force-push or rebase a result generated from older inputs.
          git push origin HEAD:refs/heads/main
          printf '%s\n' 'Updated AI_No_Resolve.yaml and Surge/AI.list on main.' >> "$GITHUB_STEP_SUMMARY"
